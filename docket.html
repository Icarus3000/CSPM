<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Add Docket (local)</title>
  <style>body{font-family:system-ui,Arial;padding:12px;background:#f6f8fb} .card{background:#fff;padding:12px;border-radius:8px} input,textarea,select{width:100%;padding:8px;margin:6px 0;border:1px solid #ddd;border-radius:6px} .btn{display:inline-block;padding:8px 12px;border-radius:8px;background:#0b63ff;color:#fff;text-decoration:none}</style>
</head>
<body>
  <div class="card">
    <h2>Add Local Docket</h2>
    <form id="f">
      <label>Title<input name="title" required></label>
      <label>Client<input name="client"></label>
      <label>Date<input type="date" name="date" value=""></label>
      <label>Notes<textarea name="notes"></textarea></label>
      <label>Link<input name="link" placeholder="https://..."></label>
      <label>Category<select name="category"><option value="today">Today</option><option value="upcoming">Upcoming</option><option value="overdue">Overdue</option><option value="bill">Bill</option><option value="readyToBill">Ready to Bill</option></select></label>
      <div style="margin-top:8px"><button class="btn" type="submit">Save locally</button> <a class="btn" href="/" style="background:#666">Back</a></div>
    </form>
    <div id="msg" style="margin-top:12px;color:green"></div>
  </div>
  <script>
    function uid(){return 'id'+Math.random().toString(36).slice(2,9)}
    function getLocal(){try{return JSON.parse(localStorage.getItem('cspm_local_dockets')||'[]')}catch(e){return []}}
    function setLocal(v){localStorage.setItem('cspm_local_dockets',JSON.stringify(v))}
    document.getElementById('f').onsubmit = function(e){ e.preventDefault(); var fd = new FormData(e.target); var obj={id:uid(),title:fd.get('title'),client:fd.get('client'),date:fd.get('date'),notes:fd.get('notes'),link:fd.get('link'),category:fd.get('category')}; var a=getLocal(); a.unshift(obj); setLocal(a); document.getElementById('msg').textContent='Saved locally. Return to briefing to see it.'; e.target.reset(); }
  </script>
</body>
</html>

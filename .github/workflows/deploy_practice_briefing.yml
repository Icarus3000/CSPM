name: Deploy Practice Briefing to GitHub Pages

on:
  push:
    paths:
      - 'src/web/practice_briefing/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify package.json exists
        run: |
          echo "== Repo files changed in this run =="
          git --no-pager diff --name-only HEAD^ HEAD || true
          if [ -f "src/web/practice_briefing/package.json" ]; then
            echo "Found package.json"
            cat src/web/practice_briefing/package.json | jq -r '.name, .version' || true
          else
            echo "ERROR: src/web/practice_briefing/package.json not found"
            exit 1
          fi

      - name: Show Node & npm versions
        run: |
          node -v || true
          npm -v || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'

      - name: Install dependencies
        working-directory: src/web/practice_briefing
        run: npm ci

      - name: Build (Vite)
        working-directory: src/web/practice_briefing
        run: npm run build

      - name: Show build output
        run: |
          echo "== Listing build output folder =="
          if [ -d "src/web/practice_briefing/dist" ]; then
            ls -la src/web/practice_briefing/dist
          else
            echo "ERROR: build output folder src/web/practice_briefing/dist not found"
            exit 1
          fi

      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: src/web/practice_briefing/dist
          clean: true
          token: ${{ secrets.GITHUB_TOKEN }}

name: Deploy Practice Briefing to GitHub Pages

on:
  push:
    paths:
      - 'src/web/practice_briefing/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: src/web/practice_briefing
        run: npm ci

      - name: Build (Vite)
        working-directory: src/web/practice_briefing
        run: npm run build

      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: src/web/practice_briefing/dist
          clean: true
          token: ${{ secrets.GITHUB_TOKEN }}

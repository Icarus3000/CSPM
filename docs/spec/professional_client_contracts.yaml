    - "tabActivated"
    - "tabDirtyChanged"
    - "saveRequested"
    - "saveCompleted"
    - "saveFailed"
    - "closeBlocked"
    - "tabDetached"
    - "tabDocked"
    - "rightDrawerOpened"
    - "rightDrawerClosed"
    - "uiFailureReported"

backend_boundary:
  selected_transport:
    id: "loopback_http_json_plus_websocket_events"
    status: "selected_for_first_external_professional_client_proof"
    query_action_channel: "HTTP JSON RPC on 127.0.0.1 only."
    event_channel: "WebSocket event stream on the same loopback host for shell, workflow, dirty-state, and notification events."
    process_model: "The Python backend process owns workbook, repositories, validation, reports, and native OS integration; QML, Flutter, and React Native clients act as presentation adapters."
    api_shape: "POST /v1/query and POST /v1/action using the request/response envelopes below; clients subscribe to /v1/events for ordered event envelopes."
    bind_policy:
      host: "127.0.0.1"
      port: "random high port announced to the launched client process"
      network_exposure: "no LAN binding, public address binding, or externally reachable listener"
    auth_policy:
      session_token: "required per launch and passed only through a protected parent/child launch channel or local secure handoff"
      cors: "deny by default; allow only the shipped local client origin when a webview/debug client requires it"
      logging: "log request IDs, action names, durations, warnings, and failures; redact confidential payload values by default"
    implementation_status:
      http_query_action_host: "implemented_explicit_start_only"
      session_token_auth: "implemented_in_memory_bearer_token"
      cors_policy: "implemented_deny_by_default"
      websocket_event_stream: "deferred"
      normal_application_startup: "listener_disabled"
    rationale:
      - "Flutter and React Native both have mature HTTP JSON and WebSocket clients across desktop/mobile targets."
      - "HTTP JSON keeps query/action tests simple and makes service contracts inspectable without QML."
      - "A WebSocket event stream maps cleanly to Option 3 tab, dirty-state, report, and notification events without polling."
      - "Keeping workbook access inside the Python process avoids exposing Excel files directly to the future client."
    rejected_for_now:
      websocket_only: "Not selected because ordinary query/action request-response flows are simpler to test and diagnose over HTTP JSON."
      local_ipc: "Not selected first because Windows named pipes or platform channels would increase framework-specific bridge work before the Flutter versus React Native decision."
      external_remote_api: "Not selected because live confidential workbook data must remain local until the security gate and SQL/API roadmap are mature."
  transport_candidates:
    - "local_http_selected_for_queries_and_actions"
    - "websocket_selected_for_events"
    - "local_ipc_deferred"
  selection_rule: "Use the selected loopback HTTP JSON plus WebSocket boundary for the first proof while keeping Flutter versus React Native undecided."
  request_envelope:
    required_fields:
      - "requestId"
      - "action"
      - "payload"
      - "actor"
      - "timestampUtc"
  response_envelope:
    required_fields:
      - "requestId"
      - "ok"
      - "payload"
      - "errors"
      - "warnings"
      - "validation"
  service_layer_rule: "Future clients should call workflow services through the same DTOs; QML Slots are an adapter surface, not the long-term contract."

first_external_client_proof:
  workflow_id: "clients_matters.client_directory_profile"
  status: "http_transport_proof_implemented_websocket_pending"
  rationale:
    - "Client Directory/Profile is already backed by real workbook data and explicit Option 3 client identity."
    - "The proof can exercise shell openWorkspace, tab activation, record identity, and read-only profile loading without touching billing or trust-sensitive write paths first."
    - "It gives a fast pass/fail signal for the local service boundary before heavier Time Docket, billing, or report replacement work."
  required_queries:
    - "listClientDirectory"
    - "getClientProfile"
  required_actions:
    - "openWorkspace"
    - "openClientProfile"
  required_events:
    - "workspaceOpened"
    - "tabActivated"
    - "clientDirectoryRefreshed"
    - "clientProfileOpened"
    - "uiFailureReported"
  acceptance:
    - "A small external Professional client can request the Client Directory through HTTP JSON and render workbook-backed rows."
    - "Opening a client uses an explicit clientId/clientName payload and creates or activates an Option 3 client profile tab."
    - "The external client receives shell/workflow events over WebSocket without polling QML state."
    - "Console QML behavior and the existing Professional QML shell remain available during the proof."
  implemented_notes:
    - "A dependency-free Python dispatcher now validates request envelopes, handles Client Directory/Profile query/action names, and publishes ordered event envelopes for the future WebSocket stream."
    - "An explicit-start stdlib HTTP host now binds only to 127.0.0.1 on a random port, requires an in-memory bearer session token, denies CORS by default, limits JSON body size, does not log request payloads or tokens, and does not expose raw backend exception details."
    - "The local HTTP proof harness requests the real Excel-backed Client Directory/Profile through the host and verifies Option 3 client-tab identity without printing confidential client payloads."
    - "No live loopback listener starts at normal application launch; WebSocket event transport remains deferred."
  deferred_until_after_proof:
    - "Mutating client profile saves through the external client."
    - "Time Docket write workflow."
    - "Docket Activity Report drilldown and export workflow."

shared_dto_conventions:
  identity_fields:
    - "entityType"
    - "entityId"
    - "entityTitle"
  stable_entity_id_examples:
    client: "clientId"
    matter: "matterId"
    time_entry: "entryId"
    deadline: "deadlineId"
    trademark: "trademarkId"
    invoice: "invoiceId"
    payment: "paymentId"
    transaction: "transactionId"
    report: "reportId"
  result_shape:
    ok: "boolean"
    message: "short user-safe status"
    payload: "workflow result data"
    errors: "blocking failures"
    warnings: "non-blocking review items"
    fieldErrors: "field-keyed validation details"
  formatting_rules:
    dates: "ISO yyyy-mm-dd for storage and transport."
    datetimes: "UTC ISO timestamps at service boundaries."
    money: "decimal strings or integer cents; do not use binary floating point in transport DTOs."
    booleans: "true/false booleans, not display strings."


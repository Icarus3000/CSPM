    - "activeFlyoutModuleId"
    - "openTabs"
    - "activeTabId"
    - "dirtyTabIds"
    - "pinnedTabIds"
    - "rightDrawer"
    - "railPinned"
    - "railExpanded"
    - "globalSearch"
  tab_dto:
    required_fields:
      - "id"
      - "title"
      - "moduleId"
      - "moduleTitle"
      - "tileIndex"
      - "nodeId"
      - "route"
      - "tabType"
      - "singleInstance"
      - "singleInstanceKey"
      - "dirty"
      - "pinned"
    optional_fields:
      - "saveCommand"
      - "entityType"
      - "entityId"
      - "entityTitle"
      - "params"
  commands:
    - name: "openWorkspace"
      payload_fields:
        - "tileIndex"
        - "nodeId"
        - "state"
      result: "workspaceOpened"
    - name: "activateTab"
      payload_fields:
        - "tabId"
      result: "tabActivated"
    - name: "closeTab"
      payload_fields:
        - "tabId"
        - "closeMode"
      result: "tabClosed or closeBlocked"
    - name: "saveDirtyTab"
      payload_fields:
        - "tabId"
        - "saveCommand"
      result: "saveCompleted or saveFailed"
    - name: "detachTab"
      payload_fields:
        - "tabId"
        - "windowGeometry"
      result: "tabDetached"
    - name: "dockTab"
      payload_fields:
        - "detachedWindowId"
        - "tab"
      result: "tabDocked"

migration_readiness_gates:
  before_flutter_react_native_decision:
    - "At least one real workflow runs through a service/view-model boundary without QML-only globals."
    - "Option 3 shell state, tab model, routes, dirty-tab behavior, and report window behavior are represented by DTOs."
    - "Transport choice is evaluated against desktop packaging, local-file access, report/PDF workflows, native windowing, and developer workflow."
    - "Console QML behavior remains untouched by Professional client migration work."
  before_external_client_poc:
    - "Select local HTTP, WebSocket, IPC, or another explicit bridge."
    - "Freeze a v1 route list from ModulePathways.js."
    - "Freeze request/response envelopes."
    - "Pick one narrow proof workflow: Client Directory/Profile, Time Docket Entry, or Docket Activity Report."
  before_module_replacement:
    - "Workflow has typed query/action/event contracts."
    - "Workflow has parity checks against the QML Professional screen."
    - "Workflow preserves autosave, dirty-close guard, detach/dock, and report/export behavior."

validation_contract:
  static_checks:
    - "YAML parses successfully."
    - "docs/spec/program_manifest.yaml lists this spec as required."
    - "tests/ui/test_quality_bootstrap_contracts.py guards required workflow coverage."
  runtime_checks:
    - "Existing QML Professional shell tests continue to pass."
    - "A future external-client proof must validate one workflow through the chosen transport boundary."

spec_version: 1
updated_utc: "2026-06-03T00:00:00Z"
status: "active"
owner: "Product + Engineering"

objective: "Define framework-neutral shell, workflow, and local-service contracts for the current QML Professional prototype and a future Flutter or React Native Professional client."

scope:
  current_client: "Qt/QML Professional mode"
  future_clients:
    - "Flutter"
    - "React Native"
  out_of_scope:
    - "Choosing Flutter versus React Native."
    - "Replacing Console mode."
    - "Changing the workbook/domain schema."
  principle: "Professional screens consume explicit queries, actions, events, routes, and DTOs instead of relying on scattered QML globals or UI-owned business rules."

source_references:
  durable_plan: "implementation_plan.md"
  option3_brief: "docs/CSPM_Option_3_Interface_Rebuild_Brief.md"
  navigation_model: "src/qml/standards/ModulePathways.js"
  professional_shell: "src/qml/components/ProfessionalAppShell.qml"
  workspace_host: "src/qml/views/MainContent.qml"
  backend_controller: "src/python/backend/app_controller.py"
  local_service_adapter: "src/python/services/professional_client_service.py"
  local_http_host: "src/python/services/professional_client_loopback_host.py"
  http_proof_harness: "scripts/run_professional_client_http_poc.py"
  domain_contract: "docs/spec/domain_contract.yaml"
  workbook_schema: "schema/workbook_schema.yml"

contract_maturity:
  shell: "v1_documented_and_prototyped"
  clients_matters: "v1_documented_and_partially_implemented"
  docketing_deadlines: "v1_documented_and_partially_implemented"
  billing_invoicing: "v1_documented_and_partially_implemented"
  finance_ledger: "v1_documented_and_partially_implemented"
  reports_exports: "v1_documented_and_partially_implemented"
  transport_boundary: "v1_selected_loopback_http_json_plus_websocket_events"
  local_service_adapter: "v0_dependency_free_dispatcher_and_explicit_start_http_host"

portable_shell_contract:
  required_state:

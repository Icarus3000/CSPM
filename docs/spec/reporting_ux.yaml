ux_requirements:
  on_screen:
    - "Clear visual hierarchy with modern, energetic styling."
    - "Interactive filters and drill-down navigation."
    - "Readable typography at desktop and laptop resolutions."
    - "Consistent theme integration with accessible contrast."
  pdf_export:
    - "One-click save to polished PDF."
    - "Controlled pagination and section headers."
    - "Brand-consistent color, spacing, and chart treatments."
  print:
    - "Printer-safe monochrome fallback."
    - "Margins and scaling optimized for letter-size output."
    - "No clipped charts or overflowing table columns."

experience_goal:
  statement: "Reports should feel premium and enjoyable to read, not like raw exports."
  design_tone:
    - "Professional"
    - "Expressive"
    - "Data-dense but approachable"


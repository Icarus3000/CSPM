[package]
name = "cspm-quick-expense"
version = "1.0.0"
edition = "2021"
description = "Standalone Native Rust Launcher & HTTP Bridge for CSPM Quick Expense Mini-App"

[[bin]]
name = "cspm-quick-expense"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 512 512"
     width="100%" height="100%"
     shape-rendering="geometricPrecision">

  <!--
    Monochrome transparent icon for HomeGrid ColorOverlay tinting.
    No background fill so theme coloring stays consistent with other glyphs.
  -->
  <defs>
    <!-- Cut the trend line where marker centers are, so hollow circles stay clean. -->
    <mask id="lineCutMask">
      <rect x="0" y="0" width="512" height="512" fill="#FFFFFF"/>
      <circle cx="143.4" cy="348.2" r="23" fill="#000000"/>
      <circle cx="220.2" cy="245.8" r="23" fill="#000000"/>
      <circle cx="286.7" cy="281.6" r="23" fill="#000000"/>
      <circle cx="358.4" cy="184.3" r="23" fill="#000000"/>
    </mask>
  </defs>

  <!-- L-shaped axes -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round">
    <line x1="72" y1="440" x2="72" y2="72" stroke-width="28"/>
    <line x1="72" y1="440" x2="440" y2="440" stroke-width="28"/>
  </g>

  <!-- Trend line -->
  <g fill="none"
     stroke="#FFFFFF"
     stroke-width="19"
     stroke-linecap="round"
     stroke-linejoin="round"
     mask="url(#lineCutMask)">
    <polyline points="143.4,348.2 220.2,245.8 286.7,281.6 358.4,184.3"/>
  </g>

  <!-- Hollow markers -->
  <g fill="none"
     stroke="#FFFFFF"
     stroke-width="12"
     stroke-linecap="round"
     stroke-linejoin="round">
    <circle cx="143.4" cy="348.2" r="23"/>
    <circle cx="220.2" cy="245.8" r="23"/>
    <circle cx="286.7" cy="281.6" r="23"/>
    <circle cx="358.4" cy="184.3" r="23"/>
  </g>

</svg>

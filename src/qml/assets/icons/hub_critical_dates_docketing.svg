<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 100 100"
     width="100%" height="100%"
     shape-rendering="geometricPrecision">

  <!--
    Monochrome + cutout construction so QML ColorOverlay can theme this glyph.
    The transparent regions become the "foreground" contrast details.
  -->
  <g transform="translate(-3 0)">
    <!-- Shield with clock-face cutout -->
    <path fill="#FFFFFF" fill-rule="evenodd"
          d="M 50 10
             Q 70 25, 90 25
             C 90 60, 75 85, 50 95
             C 25 85, 10 60, 10 25
             Q 30 25, 50 10 Z
             M 50 27
             A 25 25 0 1 0 50 77
             A 25 25 0 1 0 50 27 Z" />

    <!-- Clock dots -->
    <defs>
      <circle id="tickDot" cx="0" cy="-22" r="1.2" />
    </defs>

    <g fill="#FFFFFF" transform="translate(50 52)">
      <use href="#tickDot" transform="rotate(0)" />
      <use href="#tickDot" transform="rotate(30)" />
      <use href="#tickDot" transform="rotate(60)" />
      <use href="#tickDot" transform="rotate(90)" />
      <use href="#tickDot" transform="rotate(120)" />
      <use href="#tickDot" transform="rotate(150)" />
      <use href="#tickDot" transform="rotate(180)" />
      <use href="#tickDot" transform="rotate(210)" />
      <use href="#tickDot" transform="rotate(240)" />
      <use href="#tickDot" transform="rotate(270)" />
      <use href="#tickDot" transform="rotate(300)" />
      <use href="#tickDot" transform="rotate(330)" />
    </g>

    <!-- Clock hands -->
    <g stroke="#FFFFFF" stroke-linecap="round">
      <line x1="50" y1="52" x2="50" y2="40.0" stroke-width="2.2" />
      <line x1="50" y1="52" x2="57.0" y2="59.0" stroke-width="2.2" />
    </g>

    <!-- Warning triangle with exclamation cutouts -->
    <g transform="translate(-8 -6)">
      <path fill="#FFFFFF" fill-rule="evenodd"
            d="M 88 64
               L 104 90
               L 72 90
               Z
               M 86.7 73.3
               Q 86.7 72.0 88.0 72.0
               Q 89.3 72.0 89.3 73.3
               L 88.9 79.9
               Q 88.9 81.0 88.0 81.0
               Q 87.1 81.0 87.1 79.9
               Z
               M 88.0 82.95
               A 1.15 1.15 0 1 0 88.0 85.25
               A 1.15 1.15 0 1 0 88.0 82.95 Z" />
    </g>
  </g>
</svg>

schema_patch_version: 1
target_schema: "schema/workbook_schema.yml"
status: "draft-proposal"
notes:
  - "Append these tables to workbook_schema.yml when implementation starts."
  - "No existing table names are modified."

tables_append:
  - sheet: "Transactions"
    table: "tblTransactionsMaster"
    primary_key: "TransactionID"
    columns:
      - name: "TransactionID"
        type: "text"
      - name: "TxnDate"
        type: "date"
      - name: "Class"
        type: "text"
      - name: "BusinessUnit"
        type: "text"
      - name: "Type"
        type: "text"
      - name: "FromAccount"
        type: "text"
      - name: "ToAccount"
        type: "text"
      - name: "Payee"
        type: "text"
      - name: "Parent"
        type: "text"
      - name: "Client"
        type: "text"
      - name: "Matter"
        type: "text"
      - name: "CategoryCode"
        type: "text"
      - name: "CategoryName"
        type: "text"
      - name: "Member"
        type: "text"
      - name: "Amount"
        type: "number"
      - name: "TaxAmount"
        type: "number"
      - name: "TaxFlag"
        type: "text"
      - name: "HSTExempt"
        type: "bool-int"
      - name: "GeneralOfficeExpense"
        type: "bool-int"
      - name: "Shadow"
        type: "bool-int"
      - name: "InvoiceRef"
        type: "text"
      - name: "BillClaimPct"
        type: "number"
      - name: "TotalClaimAmount"
        type: "number"
      - name: "ExpenseDetails"
        type: "text"
      - name: "Notes"
        type: "text"
      - name: "Status"
        type: "text"
      - name: "Currency"
        type: "text"
      - name: "VoidReason"
        type: "text"
      - name: "ClearedAt"
        type: "date"
      - name: "ReconciledAt"
        type: "date"
      - name: "CreatedAt"
        type: "datetime"
      - name: "UpdatedAt"
        type: "datetime"

  - sheet: "TransactionAccounts"
    table: "tblTransactionAccounts"
    primary_key: "AccountCode"
    columns:
      - name: "AccountCode"
        type: "text"
      - name: "AccountName"
        type: "text"
      - name: "AccountKind"
        type: "text"
      - name: "Owner"
        type: "text"
      - name: "Active"
        type: "bool-int"
      - name: "AliasList"
        type: "text"

  - sheet: "TransactionCategories"
    table: "tblTransactionCategories"
    primary_key: "CategoryCode"
    columns:
      - name: "CategoryCode"
        type: "text"
      - name: "CategoryName"
        type: "text"
      - name: "Type"
        type: "text"
      - name: "ClassScope"
        type: "text"
      - name: "TaxFlagDefault"
        type: "text"
      - name: "BillableAllowed"
        type: "bool-int"
      - name: "MedicalEligible"
        type: "bool-int"
      - name: "DeductibleEligible"
        type: "bool-int"
      - name: "BusinessDeductibleEligible"
        type: "bool-int"
      - name: "Active"
        type: "bool-int"
      - name: "SortOrder"
        type: "int"
      - name: "Notes"
        type: "text"

  - sheet: "TransactionBusinessUnits"
    table: "tblTransactionBusinessUnits"
    primary_key: "BusinessUnit"
    columns:
      - name: "BusinessUnit"
        type: "text"
      - name: "Owner"
        type: "text"
      - name: "Active"
        type: "bool-int"

  - sheet: "TransactionPayees"
    table: "tblTransactionPayees"
    primary_key: "PayeeName"
    columns:
      - name: "PayeeName"
        type: "text"
      - name: "DefaultCategoryCode"
        type: "text"
      - name: "Active"
        type: "bool-int"

schema_version: 1
updated_utc: "2026-06-05T00:00:00Z"
status: "draft-canonical"
notes:
  - "This file is the canonical workbook contract for Excel-first mode."
  - "Application code must converge to this schema before SQL adapter rollout."

workbook:
  path: "data/CSPM.xlsm"
  mode: "tabular-database-only"
  constraints:
